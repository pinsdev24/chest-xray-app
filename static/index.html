<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chest X-Ray Analysis | AI Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Chest X-Ray Analysis</h1>
            <p class="subtitle">AI-Powered Pneumonia Detection Demo</p>
            <!-- <div class="disclaimer">
                ⚠️ <strong>Educational Demo Only:</strong> Do not use for medical diagnosis.
            </div> -->
        </header>

        <main class="main-card">
            <div id="upload-area" class="upload-area">
                <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
                    </path>
                </svg>
                <div class="upload-text">Drag & Drop your X-Ray image here</div>
                <div class="upload-hint">or click to browse (JPG, PNG)</div>
                <input type="file" id="file-input" accept="image/jpeg, image/png, image/jpg">
            </div>

            <div id="preview-container" class="preview-container">
                <div class="preview-image-wrapper">
                    <img id="preview-image" class="preview-image" src="" alt="X-Ray Preview">
                    <button id="remove-btn" class="remove-btn" title="Remove image">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18"
                            xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <button id="analyze-btn" class="analyze-btn" disabled>
                <span id="loader" class="loader"></span>
                <span id="btn-text">Analyze Image</span>
            </button>

            <div id="results-container" class="results-container">
                <div class="prediction-header">
                    <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Prediction
                        Result</div>
                    <div id="prediction-label" class="prediction-label">--</div>
                </div>

                <div class="prob-bars">
                    <div class="prob-item">
                        <div class="prob-info">
                            <span>Normal</span>
                            <span id="normal-prob">0%</span>
                        </div>
                        <div class="progress-bg">
                            <div id="normal-bar" class="progress-fill normal"></div>
                        </div>
                    </div>

                    <div class="prob-item">
                        <div class="prob-info">
                            <span>Pneumonia</span>
                            <span id="pneu-prob">0%</span>
                        </div>
                        <div class="progress-bg">
                            <div id="pneu-bar" class="progress-fill pneumonia"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/script.js"></script>
</body>

</html>
